[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rvs-cli-tool"
version = "0.1.0"
description = "A CLI tool for spaced repetition revision"
readme = "README.md"
authors = [{ name = "Hitesh Mulwani" }]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
requires-python = ">=3.10"

[project.scripts]
rvs = "rvs_cli.main:app"