[project]
name = "rvs-cli-tool"
version = "0.1.0"
description = "A CLI tool for spaced repetition revision of learning notes"
authors = [{name = "Hitesh Mulwani"}]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
rvs = "rvs_cli.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"